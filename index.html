<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charme Flooring｜木地板選購小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{--bg:#F6F3F0;--card:#FFFFFF;--ink:#28344A;--mute:#6C5E55;--line:#DED5CE;--accent:#28344A;--accent-ink:#FFFFFF;--warn:#71594A;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:28px 20px 56px}
h1,h2{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;line-height:1.3;margin:0}
h1{font-size:clamp(28px,7vw,40px)}
.sub{color:var(--mute);margin:10px 0 24px}
.bar{display:flex;gap:6px;margin:0 0 28px}
.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--accent)}
h2{font-size:clamp(22px,5.5vw,28px)}
.hint{color:var(--mute);font-size:14px;margin:6px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.opt b{display:block;font-weight:700}
.opt span{display:block;color:var(--mute);font-size:14px}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back{margin-top:20px;background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:8px 0;text-decoration:underline}
.back[hidden]{display:none}
.swatch{border-radius:10px;overflow:hidden;display:flex;flex-direction:column;gap:2px;background:#0003;margin:18px 0}
.swatch div{display:flex;gap:2px;height:30px}
.swatch u{display:block;flex:none;height:100%}
.pick{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px 20px}
.match{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;padding:2px 12px;border-radius:99px}
.price{font-size:15px;color:var(--mute);margin:0}
.price strong{color:var(--ink)}
ul.why{padding-left:20px;margin:14px 0}
ul.why li{margin:4px 0}
.note{color:var(--warn);font-size:14px;margin:0}
h3{font-family:"Noto Serif TC",serif;margin:30px 0 10px;font-size:18px}
.alt{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.alt .mini{width:56px;height:56px;border-radius:8px;flex:none}
.alt p{margin:0;font-size:14px;color:var(--mute)}
.alt strong{display:block;color:var(--ink);font-size:16px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:12px 22px;cursor:pointer;text-decoration:none;border:1.5px solid var(--accent)}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.s{background:none;color:var(--accent)}
.fine{color:var(--mute);font-size:12px;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.brand{display:block;height:68px;width:auto;margin:0 0 20px;-webkit-user-drag:none}

.copy{max-width:640px;margin:0 auto;padding:0 20px 40px;color:var(--mute);font-size:12px}

h1{font-size:clamp(28px,7vw,40px)}h2{font-size:22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{font:inherit;font-weight:700;background:var(--card);color:var(--accent);border:1.5px solid var(--line);border-radius:99px;padding:8px 16px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ctl{display:flex;align-items:center;gap:12px;margin:0 0 14px;color:var(--mute);font-size:14px}
.ctl input{flex:1;accent-color:var(--accent)}
.stage{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px 20px 18px}
.stack{display:flex;flex-direction:column;gap:var(--g,0px);max-width:300px;margin:0 auto;padding-right:6px;transition:gap .12s}
.layer{position:relative;display:flex;align-items:center;width:100%;border:0;border-radius:3px;padding:0 8px;cursor:pointer;box-shadow:5px 5px 0 rgba(40,52,74,.28);font:inherit;text-align:left}
.layer.sel{outline:3px solid var(--warn);outline-offset:2px}
.chip{background:rgba(255,255,255,.93);color:var(--ink);font-size:13px;font-weight:700;padding:1px 9px;border-radius:99px;white-space:nowrap}
.shint{text-align:center;color:var(--mute);font-size:13px;margin:16px 0 0}
.tx-clear{background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(190,215,235,.7));outline:1px solid #9fb5c8}
.tx-finish{background:linear-gradient(135deg,rgba(255,250,235,.9),rgba(240,220,180,.7));outline:1px solid #d6c29a}
.tx-grain{background:repeating-linear-gradient(95deg,#B98B55 0 6px,#A87A47 6px 9px,#C79A64 9px 15px)}
.tx-stone{background:radial-gradient(#8e98a8 1.2px,transparent 1.6px) 0 0/9px 9px,#6f7a8c}
.tx-foam{background:radial-gradient(#d9dde5 1px,transparent 1.4px) 0 0/6px 6px,#9aa5b6}
.tx-hdf{background:repeating-linear-gradient(90deg,#8a6a52 0 2px,#7a5c46 2px 4px,#93735a 4px 5px)}
.tx-bal{background:#A99080}
.tx-wood{background:repeating-linear-gradient(100deg,#C79A64 0 7px,#B98B55 7px 10px,#D3A874 10px 18px)}
.tx-ply{background:repeating-linear-gradient(0deg,#CBA878 0 5px,#8E6B45 5px 6px)}
.detail{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--warn);border-radius:10px;padding:16px 18px}
.detail p{margin:6px 0 0}
.meta{color:var(--mute);font-size:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.facts b{display:block;color:var(--warn);font-size:13px}
.facts .w{grid-column:1/-1}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#sec h2{font-size:22px}
.top{max-width:640px;margin:0 auto;padding:28px 20px 0}
.top .brand{margin-bottom:14px}
.navtabs{margin-bottom:0}
.top + main{padding-top:20px}
[hidden]{display:none!important}
</style>
</head>

var QS = [
 {id:"area",t:"預計鋪設多大的空間？",h:"用來估算總價，大約就好。",o:[["5 坪以下","小套房、單間臥室",4],["6–15 坪","兩房、客廳加臥室",10],["16–30 坪","三房、大客廳",22],["30 坪以上","全室或店面",40]]},
 {id:"budget",t:"每坪預算大約多少？",h:"含材料與施工的大略行情。",o:[["3,000–5,000 元","基本款",[3000,5000]],["5,000–9,000 元","品質與價格兼顧",[5000,9000]],["9,000–13,000 元","想要更好的質感",[9000,13000]],["13,000 元以上","追求實木質感",[13000,99999]]]},
 {id:"space",t:"主要鋪在哪些地方？",h:"潮濕程度會影響可選的種類。",o:[["客廳、臥室、書房","空氣乾燥穩定","dry"],["廚房、玄關、陽台旁","偶爾有水氣或濺水","wet"],["全室一起鋪","包含較潮濕的區域","mix"]]},
 {id:"home",t:"家裡有哪些成員？",h:"孩子、寵物與長輩對地板的要求不同。",o:[["有小孩或寵物","需要耐刮、好擦拭","pet"],["有長輩同住","偏好溫潤、不冰冷的腳感","senior"],["沒有特別需求","","none"]]},
 {id:"style",t:"喜歡哪一種色調？",h:"會影響推薦結果的顏色示意。",o:[["淺色木紋","明亮、北歐感","light"],["原木色","自然溫暖","natural"],["深色木紋","沉穩、有份量","dark"]]},

];
var step = 0, ans = {};
var app = document.getElementById("quiz");
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function fmt(n){return n.toLocaleString("zh-TW")}
function bar(){var h='<div class="bar" aria-hidden="true">';for(var i=0;i<QS.length;i++)h+='<i class="'+(i<=step?'on':'')+'"></i>';return h+'</div>'}
function renderQ(){
 var q=QS[step];
 var h='<h1>找到適合你家的木地板</h1><p class="sub">回答 6 個問題，依預算與生活習慣為你推薦。</p>'+bar();
 h+='<h2>'+q.t+'</h2><p class="hint">'+q.h+' （第 '+(step+1)+' 題，共 '+QS.length+' 題）</p><div class="opts">';
 q.o.forEach(function(o,i){h+='<button class="opt'+(ans[q.id]===i?' sel':'')+'" data-i="'+i+'"><b>'+o[0]+'</b>'+(o[1]?'<span>'+o[1]+'</span>':'')+'</button>'});
 h+='</div><button class="back" id="back"'+(step?'':' hidden')+'>回上一題</button>';
 app.innerHTML=h;
 app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){ans[q.id]=+b.dataset.i;if(step<QS.length-1){step++;renderQ();window.scrollTo(0,0)}else{renderResult();window.scrollTo(0,0)}}});
 document.getElementById("back").onclick=function(){step--;renderQ()};
}
function val(id){var q=QS.filter(function(x){return x.id===id})[0];return q.o[ans[id]][2]}
function score(p,idx){
 var b=val("budget"),sp=val("space"),hm=val("home"),pr=val("prio");
 var wW=sp==="wet"?14:sp==="mix"?8:0, fW=hm==="pet"?10:hm==="senior"?7:0, pW=pr==="price"?8:pr==="none"?0:8;
 var fits=p.min<=b[1], s=0, why=[];
 if(fits){s+=p.max<b[0]?34:40;why.push("每坪約 NT$ "+fmt(p.min)+"–"+fmt(p.max)+"，在你的預算範圍內")}else{s-=20}
 s+=wW*p.water; if(wW){ if(p.water<=1)why.push("較怕潮濕，鋪在水氣多的地方要多留意") }
 if(hm==="pet"){s+=fW*p.scratch; if(p.scratch>=3)why.push("表面耐刮好擦拭，適合有小孩或寵物的家")}
 if(hm==="senior"){s+=fW*p.feel; if(p.feel>=3)why.push("腳感溫潤不冰冷，適合長輩日常行走")}
 if(pr==="feel"){s+=8*p.feel;}
 if(pr==="clean"){s+=8*p.clean; if(p.clean>=3)why.push("日常清潔最省力")}
 if(pr==="price"){s+=8*(3-idx)}
 var max=40+wW*3+(hm==="none"?0:fW*3)+8*3;
 return {p:p,s:s,fits:fits,why:why,pct:Math.max(52,Math.min(98,Math.round(s/max*100)))};
}
function planks(tones,small){
 var rows=small?3:5,h="",w=[[46,30,24],[22,40,38],[34,20,46],[40,36,24],[26,44,30]];
 for(var r=0;r<rows;r++){h+='<div'+(small?' style="height:'+(56/3|0)+'px"':'')+'>';for(var c=0;c<3;c++)h+='<u style="width:'+w[r][c]+'%;background:'+tones[(r+c)%3]+'"></u>';h+='</div>'}
 return h;
}
function total(p,area){var lo=p.min*area,hi=p.max*area;function f(n){return n>=10000?(Math.round(n/1000)/10)+" 萬":fmt(n)+" 元"}return "約 NT$ "+f(lo)+"–"+f(hi)}
function renderResult(){
 var area=QS[0].o[ans.area][2], tones=TONES[val("style")];
 var rs=PRODUCTS.map(function(p,i){return score(p,i)}).sort(function(a,b){return b.s-a.s});
 var top=rs[0], h='<h1>你的推薦結果</h1><p class="sub">依你的 6 個回答計算，依符合度排序。</p>';
 h+='<section class="pick"><span class="match">符合度 '+top.pct+'%</span><h2 style="margin-top:12px">'+top.p.name+'</h2>';
 h+='<div class="swatch" role="img" aria-label="木紋色調示意">'+planks(tones)+'</div>';
 h+='<p class="price">每坪 <strong>NT$ '+fmt(top.p.min)+'–'+fmt(top.p.max)+'</strong>　'+area+' 坪預估 <strong>'+total(top.p,area)+'</strong></p>';
 h+='<ul class="why"><li>'+top.p.desc+'</li>'+top.why.map(function(w){return '<li>'+w+'</li>'}).join("")+'</ul>';
 if(!top.fits)h+='<p class="note">這個選項略高於你的預算，可以考慮縮小鋪設範圍。</p>';
 h+='<p class="note">要注意：'+top.p.note+'</p></section>';
 h+='<h3>其他可以比較的選擇</h3>';
 rs.slice(1,3).forEach(function(r){
